        // 原鄉群顏色對應表
        var colorMap = {
            '福建 (Hokkien)': '#e11d48',          // 玫瑰紅
            '廣府/廣東 (Cantonese)': '#2563eb',   // 藍色
            '客家 (Hakka)': '#16a34a',            // 綠色
            '潮州 (Teochew)': '#d97706',          // 橘色
            '海南 (Hainan)': '#9333ea',           // 紫色
            '廣西 (Kwangsi)': '#0891b2',          // 青藍
            '綜合/未指定 (Mixed/Unspecified)': '#64748b' // 灰藍
        };

        // 建立各原鄉群的 LayerGroup (為了可切換圖層)
        var layerGroups = {};
        for (var group in colorMap) {
            layerGroups[group] = L.layerGroup().addTo(map);
        }

        // 加入標記
        sitesData.forEach(function(site) {
            var color = colorMap[site.origin_group] || '#64748b';
            
            var marker = L.circleMarker([site.lat, site.lng], {
                radius: 6,
                fillColor: color,
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });

            var popupContent = `
                <div style="font-family: sans-serif; min-width: 150px;">
                    <h3 style="margin:0 0 5px 0; color:#333; font-size:15px;">${site.name}</h3>
                    <p style="margin:2px 0; font-size:13px;"><b>遺址類型:</b> ${site.category}</p>
                    <p style="margin:2px 0; font-size:13px;"><b>原鄉群:</b> ${site.origin_group}</p>
                    <p style="margin:2px 0; font-size:13px;"><b>最早銘文:</b> ${site.year}</p>
                    <p style="margin:5px 0 0 0; font-size:11px; color:#888;">ID: ${site.id}</p>
                </div>
            `;
            marker.bindPopup(popupContent);
            
            if (layerGroups[site.origin_group]) {
                marker.addTo(layerGroups[site.origin_group]);
            }
        });

        // 建立圖例與圖層控制
        var legend = L.control({position: 'topright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>原鄉群分佈</h4>';
            for (var group in colorMap) {
                div.innerHTML += 
                    '<i style="background:' + colorMap[group] + '"></i> ' + group + '<br>';
            }
            return div;
        };
        legend.addTo(map);

        // 右上角圖層開關
        L.control.layers(null, layerGroups, {position: 'topleft'}).addTo(map);

    </script>
